<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header class="divider">
      <div class="logo">
        <img
          src="../images/noun_Tent_2517.svg"
          alt="tent image for logo"
        />

        <a href="../index.html">
          Sleep<span class="highlight">Outside</span>
        </a>
      </div>

      <div class="cart">
        <a href="../cart/">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
          >
            <path
              d="M7 4V2H5v2H2v2h2l3.6 7.59-1.35 2.44A1.99 1.99 0 0 0 8 19h10v-2H8.42a.25.25 0 0 1-.22-.37L9.1 15h7.45a2 2 0 0 0 1.75-1.03L21.58 6H7.42L7 4zm1 16a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"
            />
          </svg>
        </a>
      </div>
    </header>

    <main class="divider checkout">
      <section class="products">
        <h2>Review &amp; Place Your Order</h2>

        <form id="checkoutForm">
          <fieldset>
            <legend>Customer Information</legend>

            <label for="fname">First Name</label>
            <input
              type="text"
              id="fname"
              name="fname"
              required
            />

            <label for="lname">Last Name</label>
            <input
              type="text"
              id="lname"
              name="lname"
              required
            />

            <label for="street">Street Address</label>
            <input
              type="text"
              id="street"
              name="street"
              required
            />

            <label for="city">City</label>
            <input
              type="text"
              id="city"
              name="city"
              required
            />

            <label for="state">State</label>
            <input
              type="text"
              id="state"
              name="state"
              required
            />

            <label for="zip">ZIP Code</label>
            <input
              type="text"
              id="zip"
              name="zip"
              required
            />
          </fieldset>

          <fieldset>
            <legend>Payment Information</legend>

            <label for="cardNumber">Credit Card Number</label>
            <input
              type="text"
              id="cardNumber"
              name="cardNumber"
              required
            />

            <label for="expiration">Expiration Date</label>
            <input
              type="text"
              id="expiration"
              name="expiration"
              placeholder="MM/YY"
              required
            />

            <label for="code">Security Code</label>
            <input
              type="text"
              id="code"
              name="code"
              required
            />
          </fieldset>

          <button type="submit">Checkout</button>
        </form>
      </section>

      <section class="order-summary">
        <h2>Order Summary</h2>

        <p>
          Items:
          <span id="numItems">0</span>
        </p>

        <p>
          Subtotal:
          $<span id="subtotal">0.00</span>
        </p>

        <p>
          Tax:
          $<span id="tax">0.00</span>
        </p>

        <p>
          Shipping:
          $<span id="shipping">0.00</span>
        </p>

        <p>
          <strong>
            Order Total:
            $<span id="orderTotal">0.00</span>
          </strong>
        </p>
      </section>
    </main>

    <footer>&copy;NOT a real business</footer>

    <script type="module" src="../js/checkout.js"></script>
      </body>
</html>
